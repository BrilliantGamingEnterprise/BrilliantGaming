    <radialGradient id="cyan"><stop stop-color="#25f4ee" stop-opacity=".42"/><stop offset="1" stop-color="#25f4ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#fe2c55" stop-opacity=".4"/><stop offset="1" stop-color="#fe2c55" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0v58" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern>
